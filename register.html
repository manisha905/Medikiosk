<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediKiosk — Create your health ID</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #F3F2EC;
    --ink: #0F2B28;
    --ink-soft: #4A5F5B;
    --primary: #0F6B5C;
    --primary-dark: #0A4B40;
    --primary-tint: #E4EFEC;
    --accent: #E08A2B;
    --accent-tint: #FCEEDA;
    --card: #FFFFFF;
    --line: #D8E2DE;
    --error: #B3402A;
    --error-tint: #FBEAE6;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .shell{
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }

  /* ---------- LEFT RAIL ---------- */
  .rail{
    background: var(--primary-dark);
    color: #EFF6F4;
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800; font-size: 16px; color: var(--primary-dark);
    flex-shrink: 0;
  }
  .brand-name{ font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .brand-sub{ font-size: 12.5px; color: #9FC4BC; margin-top: 2px; }

  .steps{ margin-top: 56px; display: flex; flex-direction: column; gap: 0; }
  .step-item{
    display:flex; gap: 16px; padding-bottom: 34px; position: relative;
  }
  .step-item::before{
    content: '';
    position: absolute;
    left: 15px; top: 34px; bottom: 0;
    width: 1px;
    background: rgba(255,255,255,0.14);
  }
  .step-item:last-child::before{ display:none; }
  .step-num{
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.28);
    display:flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 700; color: #C7DFDA;
    flex-shrink:0; transition: all 0.25s ease;
    background: transparent;
  }
  .step-item.active .step-num{
    background: var(--accent); border-color: var(--accent); color: var(--primary-dark);
  }
  .step-item.done .step-num{
    background: #2E8C77; border-color: #2E8C77; color: white;
  }
  .step-text{ padding-top: 5px; }
  .step-title{ font-size: 14.5px; font-weight: 700; color: #F4FAF8; }
  .step-desc{ font-size: 12.5px; color: #9FC4BC; margin-top: 3px; line-height: 1.5; max-width: 220px; }

  .rail-foot{ font-size: 11.5px; color: #7FA79F; line-height: 1.6; }

  /* ---------- RIGHT PANEL ---------- */
  .panel{
    display:flex; align-items:center; justify-content:center;
    padding: 40px 24px;
  }
  .card{
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 36px;
  }
  .card h1{
    font-size: 23px; font-weight: 800; letter-spacing: -0.015em;
    margin: 0 0 6px 0;
  }
  .card .lede{
    font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 28px 0;
  }

  .choice-row{ display:flex; gap: 12px; margin-bottom: 22px; }
  .choice{
    flex:1; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 16px 14px; cursor: pointer; background: white;
    transition: border-color .15s ease, background .15s ease;
  }
  .choice:hover{ border-color: #B7CFC9; }
  .choice.selected{ border-color: var(--primary); background: var(--primary-tint); }
  .choice-label{ font-weight: 700; font-size: 14px; }
  .choice-hint{ font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  label{ display:block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 7px; }
  .field{ margin-bottom: 18px; }
  input[type=text], input[type=tel]{
    width: 100%; padding: 12px 14px; font-size: 15px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 10px; background: white; color: var(--ink);
    letter-spacing: 0.02em;
  }
  input:focus{ outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .err{ font-size: 12.5px; color: var(--error); margin-top: 6px; font-weight: 600; display:none; }
  .field.invalid input{ border-color: var(--error); }
  .field.invalid .err{ display:block; }

  .captcha-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 18px; }
  .captcha-box{
    background: var(--primary-tint); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 18px; font-size: 20px; font-weight: 800; letter-spacing: 6px;
    color: var(--primary-dark); user-select: none; position: relative; overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  .captcha-box::before, .captcha-box::after{
    content:''; position:absolute; height:1px; background: rgba(15,107,92,0.35);
  }
  .captcha-box::before{ top: 40%; left: 0; right: 0; transform: rotate(-3deg); }
  .captcha-box::after{ top: 62%; left: 0; right: 0; transform: rotate(2deg); }
  .refresh-btn{
    width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line);
    background: white; cursor: pointer; display:flex; align-items:center; justify-content:center;
    font-size: 16px; color: var(--ink-soft); flex-shrink: 0;
  }
  .refresh-btn:hover{ border-color: var(--primary); color: var(--primary); }

  .btn{
    width: 100%; padding: 13px 18px; border-radius: 10px; border: none;
    background: var(--primary); color: white; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .15s ease;
  }
  .btn:hover{ background: var(--primary-dark); }
  .btn:disabled{ background: #B9C7C3; cursor: not-allowed; }
  .btn-ghost{
    background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); margin-top: 10px;
  }
  .btn-ghost:hover{ background: var(--bg); color: var(--ink); }

  .spinner{
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%; display: inline-block;
    animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -2px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .verified-banner{
    display:none; align-items:center; gap: 10px;
    background: var(--primary-tint); border: 1px solid #BEDAD3; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 20px; font-size: 13.5px; font-weight: 600; color: var(--primary-dark);
  }
  .verified-banner.show{ display:flex; }
  .check-dot{
    width: 20px; height: 20px; border-radius: 50%; background: var(--primary);
    color: white; font-size: 12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .otp-row{ display:flex; gap: 8px; margin-bottom: 6px; }
  .otp-digit{
    width: 44px; height: 52px; text-align:center; font-size: 20px; font-weight: 800;
    border: 1.5px solid var(--line); border-radius: 10px; font-family: inherit;
  }
  .otp-digit:focus{ outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }

  .resend{ font-size: 13px; color: var(--ink-soft); margin: 14px 0 22px; }
  .resend button{ background:none; border:none; color: var(--primary); font-weight:700; cursor:pointer; padding:0; font-size:13px; font-family: inherit; }
  .resend button:disabled{ color: #A9B8B4; cursor: default; }

  /* success */
  .success-wrap{ text-align:center; }
  .success-icon{
    width: 62px; height: 62px; border-radius: 50%; background: var(--accent-tint);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 20px;
    font-size: 28px; color: var(--accent);
  }
  .id-card{
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 14px; padding: 22px 24px; margin: 22px 0; text-align:left;
    color: white;
  }
  .id-card .id-label{ font-size: 11px; letter-spacing: 0.04em; color: #A9D4C9; font-weight: 700; }
  .id-card .id-value{ font-size: 24px; font-weight: 800; letter-spacing: 0.04em; margin-top: 6px; font-family: 'Courier New', monospace; }
  .id-card .id-meta{ font-size: 12px; color: #BFE0D8; margin-top: 14px; display:flex; justify-content: space-between; }

  .back-link{
    display:inline-block; margin-bottom: 18px; font-size: 13px; color: var(--ink-soft);
    text-decoration:none; cursor:pointer; font-weight: 600;
  }
  .back-link:hover{ color: var(--primary); }

  @media (max-width: 820px){
    .shell{ grid-template-columns: 1fr; }
    .rail{ padding: 28px 24px; }
    .steps{ display:none; }
    .rail-foot{ display:none; }
    .card{ padding: 30px 22px; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="rail">
    <div>
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name">MediKiosk</div>
          <div class="brand-sub">Unified health ID</div>
        </div>
      </div>

      <div class="steps" id="steps"></div>
    </div>
    <div class="rail-foot">
      Prototype interface. Aadhaar and driving licence verification shown here is simulated for design purposes and is not connected to UIDAI, Sarathi, or any government system.
    </div>
  </div>

  <div class="panel">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
const STEP_META = [
  { title: 'Choose ID type', desc: 'Aadhaar or driving licence' },
  { title: 'Verify identity', desc: 'Enter number and captcha' },
  { title: 'Mobile number', desc: 'Where to send your OTP' },
  { title: 'Confirm OTP', desc: 'One-time password check' },
  { title: 'Your MediKiosk ID', desc: 'Ready to use' },
];

let state = {
  step: 0,
  idType: null,        // 'aadhaar' | 'dl'
  idNumber: '',
  captchaText: '',
  captchaInput: '',
  mobile: '',
  otpDigits: ['','','','',''],
  generatedOtp: '',
  medikioskId: null,
};

function renderSteps(){
  const el = document.getElementById('steps');
  el.innerHTML = STEP_META.map((s, i) => {
    let cls = '';
    if(i < state.step) cls = 'done';
    else if(i === state.step) cls = 'active';
    const num = i < state.step ? '✓' : (i+1);
    return `<div class="step-item ${cls}">
      <div class="step-num">${num}</div>
      <div class="step-text">
        <div class="step-title">${s.title}</div>
        <div class="step-desc">${s.desc}</div>
      </div>
    </div>`;
  }).join('');
}

function genCaptcha(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<5;i++) out += chars[Math.floor(Math.random()*chars.length)];
  state.captchaText = out;
}

function genMedikioskId(){
  const seg = () => Math.floor(1000 + Math.random()*9000);
  return `MK-${seg()}-${seg()}-${seg()}`;
}

function validIdNumber(){
  const v = state.idNumber.replace(/\s/g,'');
  if(state.idType === 'aadhaar') return /^\d{12}$/.test(v);
  if(state.idType === 'dl') return /^[A-Za-z]{2}\d{2}\d{4}\d{7}$|^[A-Za-z]{2}[0-9]{13}$/.test(v) || v.length >= 10;
  return false;
}

function render(){
  renderSteps();
  const card = document.getElementById('card');

  if(state.step === 0){
    card.innerHTML = `
      <h1>Create your MediKiosk ID</h1>
      <p class="lede">A single health identity you can use at any partner clinic, pharmacy, or diagnostic centre. Start by telling us which document you'd like to verify with.</p>
      <div class="choice-row">
        <div class="choice" id="choice-aadhaar">
          <div class="choice-label">Aadhaar</div>
          <div class="choice-hint">12-digit UID number</div>
        </div>
        <div class="choice" id="choice-dl">
          <div class="choice-label">Driving licence</div>
          <div class="choice-hint">State-issued DL number</div>
        </div>
      </div>
      <button class="btn" id="continue-btn" disabled>Continue</button>
    `;
    const aad = document.getElementById('choice-aadhaar');
    const dl = document.getElementById('choice-dl');
    const cont = document.getElementById('continue-btn');
    function pick(type, el){
      state.idType = type;
      [aad,dl].forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      cont.disabled = false;
    }
    aad.onclick = () => pick('aadhaar', aad);
    dl.onclick = () => pick('dl', dl);
    cont.onclick = () => { genCaptcha(); state.step = 1; render(); };
  }

  else if(state.step === 1){
    genCaptcha();
    const label = state.idType === 'aadhaar' ? 'Aadhaar number' : 'Driving licence number';
    const placeholder = state.idType === 'aadhaar' ? 'XXXX XXXX XXXX' : 'e.g. TS12 20231234567';
    card.innerHTML = `
      <a class="back-link" id="back">&larr; Change ID type</a>
      <h1>Verify your ${state.idType === 'aadhaar' ? 'Aadhaar' : 'driving licence'}</h1>
      <p class="lede">We'll check this number is a valid, registered identity number before continuing. Nothing is stored until verification succeeds.</p>

      <div class="field" id="id-field">
        <label>${label}</label>
        <input type="text" id="id-input" placeholder="${placeholder}" maxlength="20" autocomplete="off">
        <div class="err">Enter a valid ${label.toLowerCase()}.</div>
      </div>

      <label>Enter the code shown</label>
      <div class="captcha-row">
        <div class="captcha-box" id="captcha-display">${state.captchaText}</div>
        <button class="refresh-btn" id="refresh-captcha" title="Get a new code">&#8635;</button>
      </div>
      <div class="field" id="captcha-field">
        <input type="text" id="captcha-input" placeholder="Type the code above" maxlength="5" autocomplete="off" style="text-transform:uppercase;">
        <div class="err">That code didn't match. Try again.</div>
      </div>

      <button class="btn" id="verify-btn"><span id="verify-label">Verify identity</span></button>
      <button class="btn btn-ghost" id="back2">Back</button>
    `;

    document.getElementById('back').onclick = () => { state.step = 0; render(); };
    document.getElementById('back2').onclick = () => { state.step = 0; render(); };
    document.getElementById('refresh-captcha').onclick = () => {
      genCaptcha();
      document.getElementById('captcha-display').textContent = state.captchaText;
    };

    document.getElementById('verify-btn').onclick = () => {
      const idInput = document.getElementById('id-input').value.trim();
      const captchaInput = document.getElementById('captcha-input').value.trim().toUpperCase();
      state.idNumber = idInput;
      state.captchaInput = captchaInput;

      const idField = document.getElementById('id-field');
      const captchaField = document.getElementById('captcha-field');
      idField.classList.remove('invalid');
      captchaField.classList.remove('invalid');

      let ok = true;
      if(!validIdNumber()){ idField.classList.add('invalid'); ok = false; }
      if(captchaInput !== state.captchaText){ captchaField.classList.add('invalid'); ok = false; }
      if(!ok) return;

      const btn = document.getElementById('verify-btn');
      const label = document.getElementById('verify-label');
      btn.disabled = true;
      label.innerHTML = `<span class="spinner"></span>Verifying with registry…`;

      setTimeout(() => {
        state.step = 2;
        render();
      }, 1400);
    };
  }

  else if(state.step === 2){
    card.innerHTML = `
      <div class="verified-banner show">
        <div class="check-dot">✓</div>
        <div>${state.idType === 'aadhaar' ? 'Aadhaar' : 'Driving licence'} verified successfully</div>
      </div>
      <h1>Where should we send your OTP?</h1>
      <p class="lede">Enter the mobile number linked to your MediKiosk account. We'll text you a one-time password to confirm it's you.</p>

      <div class="field" id="mobile-field">
        <label>Mobile number</label>
        <input type="tel" id="mobile-input" placeholder="10-digit mobile number" maxlength="10" autocomplete="off">
        <div class="err">Enter a valid 10-digit mobile number.</div>
      </div>

      <button class="btn" id="send-otp-btn">Send OTP</button>
    `;
    document.getElementById('send-otp-btn').onclick = () => {
      const val = document.getElementById('mobile-input').value.trim();
      const field = document.getElementById('mobile-field');
      field.classList.remove('invalid');
      if(!/^[6-9]\d{9}$/.test(val)){ field.classList.add('invalid'); return; }
      state.mobile = val;
      state.generatedOtp = String(Math.floor(1000 + Math.random()*9000)); // demo only, not sent anywhere real
      state.otpDigits = ['','','','',''].slice(0,4).fill('');
      state.step = 3;
      render();
    };
  }

  else if(state.step === 3){
    const masked = state.mobile.slice(0,2) + '••••••' + state.mobile.slice(-2);
    card.innerHTML = `
      <a class="back-link" id="back">&larr; Change number</a>
      <h1>Enter the OTP</h1>
      <p class="lede">We've sent a 4-digit code to <strong>${masked}</strong>. It's valid for 5 minutes.</p>

      <div class="otp-row" id="otp-row">
        ${[0,1,2,3].map(i => `<input class="otp-digit" id="otp-${i}" maxlength="1" inputmode="numeric">`).join('')}
      </div>
      <div class="err" id="otp-err" style="display:none; margin-bottom: 18px;">Incorrect code. Please try again.</div>

      <div class="resend">
        Didn't get it? <button id="resend-btn">Resend code</button>
        <span id="demo-otp-hint" style="display:block; margin-top:6px; color:#A9B8B4;">Demo mode — your code is ${state.generatedOtp}</span>
      </div>

      <button class="btn" id="confirm-otp-btn">Confirm & create ID</button>
    `;

    document.getElementById('back').onclick = () => { state.step = 2; render(); };

    const inputs = [0,1,2,3].map(i => document.getElementById(`otp-${i}`));
    inputs.forEach((inp, i) => {
      inp.oninput = () => {
        inp.value = inp.value.replace(/\D/g,'');
        if(inp.value && i < 3) inputs[i+1].focus();
      };
      inp.onkeydown = (e) => {
        if(e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
      };
    });

    document.getElementById('resend-btn').onclick = (e) => {
      state.generatedOtp = String(Math.floor(1000 + Math.random()*9000));
      document.getElementById('demo-otp-hint').textContent = `Demo mode — your code is ${state.generatedOtp}`;
      e.target.disabled = true;
      e.target.textContent = 'Sent';
      setTimeout(()=>{ e.target.disabled = false; e.target.textContent = 'Resend code'; }, 3000);
    };

    document.getElementById('confirm-otp-btn').onclick = () => {
      const entered = inputs.map(i => i.value).join('');
      const err = document.getElementById('otp-err');
      if(entered.length < 4 || entered !== state.generatedOtp){
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      state.medikioskId = genMedikioskId();
      state.step = 4;
      render();
    };
  }

  else if(state.step === 4){
    card.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon">✓</div>
        <h1 style="text-align:center;">You're registered</h1>
        <p class="lede" style="text-align:center;">Your MediKiosk ID is ready. Show this at any partner facility to pull up your records instantly.</p>

        <div class="id-card">
          <div class="id-label">MEDIKIOSK ID</div>
          <div class="id-value">${state.medikioskId}</div>
          <div class="id-meta">
            <span>Verified via ${state.idType === 'aadhaar' ? 'Aadhaar' : 'Driving licence'}</span>
            <span>Mobile linked</span>
          </div>
        </div>

        <button class="btn" id="restart-btn">Register another person</button>
      </div>
    `;
    document.getElementById('restart-btn').onclick = () => {
      state = { step: 0, idType: null, idNumber: '', captchaText: '', captchaInput: '', mobile: '', otpDigits: ['','','','',''], generatedOtp: '', medikioskId: null };
      render();
    };
  }
}

render();
</script>
</body>
</html>

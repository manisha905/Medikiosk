<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Services Portal — Secure registration</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--navy:#172b4d;--ink:#24324a;--muted:#65728a;--rose:#d84e78;--rose-dark:#b83b61;--line:#dce1e8;--teal:#237c80;--tint:#fff5f7;--bg:#fffafb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.page{min-height:100vh;position:relative;overflow:hidden}.page:before,.page:after{content:"";position:absolute;border-radius:999px;background:radial-gradient(circle at 35% 35%,#ffe9ed,transparent 66%);pointer-events:none}.page:before{width:520px;height:520px;left:-270px;top:60px}.page:after{width:480px;height:480px;right:-260px;bottom:-180px}.topbar{height:92px;display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:auto;padding:0 28px;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:14px}.seal{width:45px;height:45px;border:1.5px solid #aec0d5;border-radius:50%;display:grid;place-items:center;color:var(--navy);font-size:24px;font-family:Georgia}.brand b{display:block;font-size:18px;color:var(--navy)}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.secure{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:99px;background:#eaf6f5;color:#216c70;font-size:13px;font-weight:700}.wrap{position:relative;z-index:1;width:min(760px,calc(100% - 36px));margin:62px auto 44px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;padding:42px 52px;box-shadow:0 18px 50px rgba(42,56,82,.09)}.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-bottom:40px}.steps:before{content:"";position:absolute;height:2px;background:#dbe0e8;left:11%;right:11%;top:15px;z-index:0}.step{text-align:center;position:relative;z-index:1;color:#7d8799;font-size:12px;font-weight:600}.bubble{width:32px;height:32px;margin:0 auto 9px;display:grid;place-items:center;border-radius:50%;border:1.5px solid #cbd2dd;background:#fff;font-size:13px}.step.active{color:var(--rose);font-weight:700}.step.active .bubble{border-color:var(--rose);background:var(--rose);color:#fff}.step.done .bubble{border-color:var(--teal);background:var(--teal);color:#fff}.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:10px}h1{font-family:'Playfair Display',serif;font-size:37px;line-height:1.12;margin:0;color:var(--navy);letter-spacing:-.03em}.lede{line-height:1.65;color:var(--muted);margin:13px 0 30px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{position:relative;min-height:164px;padding:24px 20px;border:1.5px solid var(--line);border-radius:16px;background:#fff;text-align:left;cursor:pointer;transition:.18s}.choice:hover{border-color:#e69ab0;transform:translateY(-2px)}.choice.selected{border-color:var(--rose);background:var(--tint);box-shadow:0 0 0 3px #fde6ec}.icon{display:grid;place-items:center;width:45px;height:45px;border-radius:12px;background:#f5f7fa;color:var(--navy);font-size:24px}.selected .icon{background:#fde1e8;color:var(--rose)}.choice b{display:block;margin-top:17px;font-size:16px}.choice span{display:block;margin-top:5px;font-size:13px;color:var(--muted)}.tick{display:none;position:absolute;right:15px;top:15px;width:24px;height:24px;border-radius:50%;place-items:center;background:var(--rose);color:#fff;font-size:13px;font-style:normal}.selected .tick{display:grid}.button{width:100%;margin-top:26px;border:0;border-radius:11px;padding:15px 20px;background:var(--rose);color:#fff;font:700 15px 'DM Sans',sans-serif;cursor:pointer;transition:.18s}.button:hover{background:var(--rose-dark)}.back{border:0;background:none;color:var(--muted);padding:0;font:600 13px 'DM Sans',sans-serif;cursor:pointer;margin-bottom:18px}.back:hover{color:var(--rose)}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font:15px 'DM Sans',sans-serif;color:var(--ink);outline:0}.input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #fde8ed}.hint{font-size:12px;color:var(--muted);margin-top:7px}.notice{display:flex;gap:10px;padding:14px 15px;background:#edf8f7;border:1px solid #c8e5e1;border-radius:11px;color:#276b70;font-size:13px;line-height:1.45}.otp{display:flex;gap:10px}.otp input{width:56px;height:58px;text-align:center;font:700 22px 'DM Sans',sans-serif;border:1.5px solid var(--line);border-radius:10px;outline:0}.otp input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #fde8ed}.error{min-height:18px;color:#b93c5a;font-size:13px;font-weight:600;margin-top:8px}.privacy{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:25px;color:var(--muted);font-size:12px;text-align:center}.privacy i{font-style:normal;color:var(--teal)}.footer{position:relative;z-index:1;display:flex;justify-content:center;gap:42px;color:#7d8799;font-size:12px;padding:18px}.footer span:before{content:'✦';color:#de8fa6;margin-right:7px}.success{text-align:center}.success-mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#e7f5f3;color:var(--teal);font-size:32px;margin:0 auto 20px}.success h1{font-size:34px}.id-panel{margin:26px 0;padding:20px;border-radius:14px;text-align:left;background:#f7fbfb;border:1px solid #d4e8e5}.id-panel small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}.id-panel b{display:block;margin-top:8px;font-size:22px;color:var(--navy);letter-spacing:.03em}.helper{font-size:13px;color:var(--muted);margin-top:16px}.resend{border:0;background:none;padding:0;color:var(--rose);font:700 13px 'DM Sans';cursor:pointer}@media(max-width:650px){.topbar{height:78px;padding:0 18px}.brand small{display:none}.secure{font-size:0;padding:10px}.wrap{margin:24px auto}.card{padding:30px 22px}.steps{margin-bottom:31px}.step{font-size:10px}.bubble{width:28px;height:28px}h1{font-size:30px}.choices{grid-template-columns:1fr}.choice{min-height:130px}.footer{gap:12px;flex-wrap:wrap}.otp{gap:7px}.otp input{width:calc((100vw - 96px)/4)}}
</style></head><body><div class="page"><header class="topbar"><div class="brand"><div class="seal">✚</div><div><b>Health Services Portal</b><small>Accessible healthcare for every citizen</small></div></div><div class="secure">▣&nbsp; Secure registration</div></header><main class="wrap"><section class="card"><div id="app"></div></section></main><footer class="footer"><span>Private & secure</span><span>Accessible healthcare</span><span>Citizen-first services</span></footer></div>
<script>
const app=document.querySelector('#app');let state={step:1,type:'aadhaar',id:'',mobile:'',otp:''};const steps=['Choose ID','Verify identity','Mobile OTP','Confirmation'];
function stepper(){return `<div class="steps">${steps.map((s,i)=>`<div class="step ${state.step===i+1?'active':state.step>i+1?'done':''}"><div class="bubble">${state.step>i+1?'✓':i+1}</div>${s}</div>`).join('')}</div>`}function shell(c){app.innerHTML=stepper()+c+`<div class="privacy"><i>▣</i>Your information is protected and used only for health services.</div>`}
function render(){if(state.step===1)choose();else if(state.step===2)identity();else if(state.step===3)mobile();else if(state.step===4)confirm();else finish()}
function choose(){shell(`<div class="eyebrow">Step 1 of 4</div><h1>Verify your identity</h1><p class="lede">Choose one document to begin your secure registration.</p><div class="choices"><button class="choice ${state.type==='aadhaar'?'selected':''}" data-id="aadhaar"><i class="tick">✓</i><div class="icon">⌁</div><b>Aadhaar</b><span>Use your 12-digit Aadhaar number</span></button><button class="choice ${state.type==='licence'?'selected':''}" data-id="licence"><i class="tick">✓</i><div class="icon">▤</div><b>Driving Licence</b><span>Use your state-issued licence number</span></button></div><button class="button" id="next">Continue&nbsp; →</button>`);document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{state.type=x.dataset.id;render()});document.querySelector('#next').onclick=()=>{state.step=2;render()}}
function identity(){let a=state.type==='aadhaar';shell(`<button class="back" id="back">← Change ID type</button><div class="eyebrow">Step 2 of 4</div><h1>Verify your ${a?'Aadhaar':'driving licence'}</h1><p class="lede">Enter your document number. This prototype simulates a secure identity check.</p><div class="field"><label>${a?'Aadhaar number':'Driving licence number'}</label><input class="input" id="identity" inputmode="numeric" maxlength="20" placeholder="${a?'XXXX XXXX XXXX':'e.g. KA01 2024 1234567'}"><div class="hint">Your document details are encrypted in transit.</div></div><div class="notice"><span>✓</span><span>We will only use this information to verify your identity for health services.</span></div><div class="error" id="error"></div><button class="button" id="verify">Verify identity&nbsp; →</button>`);document.querySelector('#back').onclick=()=>{state.step=1;render()};document.querySelector('#verify').onclick=()=>{let v=document.querySelector('#identity').value.replace(/\s/g,'');if(!(a?/^\d{12}$/.test(v):v.length>=10)){document.querySelector('#error').textContent=`Please enter a valid ${a?'12-digit Aadhaar number':'driving licence number'}.`;return}state.id=v;state.step=3;render()}}
function mobile(){shell(`<button class="back" id="back">← Back to identity verification</button><div class="eyebrow">Step 3 of 4</div><h1>Confirm your mobile number</h1><p class="lede">We’ll send a one-time password to securely confirm your contact number.</p><div class="field"><label>Mobile number</label><input class="input" id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><div class="hint">Only Indian mobile numbers are supported at this time.</div></div><div class="error" id="error"></div><button class="button" id="send">Send OTP&nbsp; →</button>`);document.querySelector('#back').onclick=()=>{state.step=2;render()};document.querySelector('#send').onclick=()=>{let v=document.querySelector('#mobile').value;if(!/^[6-9]\d{9}$/.test(v)){document.querySelector('#error').textContent='Please enter a valid 10-digit mobile number.';return}state.mobile=v;state.step=4;render()}}
function confirm(){let m=state.mobile.slice(0,2)+' •••••• '+state.mobile.slice(-2);shell(`<button class="back" id="back">← Change mobile number</button><div class="eyebrow">Step 4 of 4</div><h1>Enter the OTP</h1><p class="lede">A four-digit code was sent to <b>${m}</b>.</p><div class="otp" id="otp">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="OTP digit ${i+1}">`).join('')}</div><div class="error" id="error"></div><p class="helper">Demo code: <b>1234</b> &nbsp;·&nbsp; <button class="resend" id="resend">Resend code</button></p><button class="button" id="confirm">Confirm and continue&nbsp; →</button>`);document.querySelector('#back').onclick=()=>{state.step=3;render()};let f=[...document.querySelectorAll('#otp input')];f.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'');if(x.value&&i<3)f[i+1].focus()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&i)f[i-1].focus()}});f[0].focus();document.querySelector('#confirm').onclick=()=>{if(f.map(x=>x.value).join('')!=='1234'){document.querySelector('#error').textContent='That OTP does not match. Please try again.';return}localStorage.setItem('medikioskPatient',JSON.stringify({medikioskId:'HSP-'+Math.floor(100000+Math.random()*899999),documents:[]}));state.step=5;render()};document.querySelector('#resend').onclick=e=>{e.target.textContent='Code sent';e.target.disabled=true}}
function finish(){let id=JSON.parse(localStorage.getItem('medikioskPatient')).medikioskId;shell(`<div class="success"><div class="success-mark">✓</div><div class="eyebrow">Registration complete</div><h1>Your identity is confirmed</h1><p class="lede">Your secure health profile is ready. You can now view your health services dashboard.</p><div class="id-panel"><small>Health Services ID</small><b>${id}</b></div><button class="button" id="dashboard">Open dashboard&nbsp; →</button></div>`);document.querySelector('#dashboard').onclick=()=>location.href='patient-dashboard.html'}render();
</script></body></html>
